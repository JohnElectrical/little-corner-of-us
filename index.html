function mark(){const on=document.body.classList.contains('ed');MK.forEach(([s,k,i])=>{const e=document.querySelectorAll(s)[i||0];if(!e)return;e.dataset.e=k;e.contentEditable=on;e.oninput=()=>{const[t,n]=k.split(':');if(t=='h')D.home[n]=e.textContent;else(D.t=D.t||{})[n]=e.textContent}})}
function tog(){document.body.classList.toggle('ed');mark();toast(document.body.classList.contains('ed')?'Tap any dashed text to edit it. Press Save when done.':'Edit mode off')}
function prev(){adm.classList.remove('on');bar.style.display='flex';go('home')}
function back(){bar.style.display='none';document.body.classList.remove('ed');mark();adm.classList.add('on');A()}
document.addEventListener('click',e=>{if(document.body.classList.contains('ed')&&e.target.closest('[data-e]')){e.preventDefault();e.stopPropagation()}},true);
function logout(){ok=false;adm.classList.remove('on');bar.style.display='none';document.body.classList.remove('ed');mark()}
async function save(){D.ts=Date.now();try{localStorage.setItem(K,JSON.stringify(D))}catch(e){toast('Storage full on this device, continuing...')}
if(SB()&&TOK){try{const r=await fetch(CFG.url+'/rest/v1/site?id=eq.1',{method:'PATCH',headers:{apikey:CFG.key,Authorization:'Bearer '+TOK,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({data:D})});if(!r.ok)throw (r.status+' '+(await r.text()).slice(0,140));toast('Saved for everyone ♡')}catch(e){toast('Could not save online: '+e)}R();return}
const j=JSON.stringify(D).replace(/</g,'\\u003c');const html=SRC.replace(/(<script id="st" type="application\/json">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+j+b);
try{const a=window.claude&&await claude.use('artifact');if(!a){const bl=new Blob([html],{type:'text/html'}),l=document.createElement('a');l.href=URL.createObjectURL(bl);l.download='index.html';document.body.appendChild(l);l.click();l.remove();toast('Downloaded index.html. Upload it to GitHub to update the site for everyone.');R();return}
toast('Publishing for everyone...');await a.publish(html)}catch(e){toast('Could not publish: '+((e&&e.code)||'error'));R()}}
const SC={Photos:['photos',['cap'],1],Reasons:['reasons',['title','text']],Timeline:['timeline',['date','title','text'],1],Playlist:['playlist',['title','artist','url']],'Special Dates':['dates',['date','title']]};
const HF=[['title','Hero heading'],['text','Hero text'],['welcome','Envelope welcome message'],['tell','"Tell Me!" message'],['hug','Hug message'],['endT','Final heading'],['endS','Final subtitle']];
const S=(k,i,f,v)=>{D[k][i][f]=v};
function fin(el,cb){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.7))};im.src=r.result};r.readAsDataURL(f)}
function up(el,k,i){fin(el,d=>{D[k][i].img=d;A()})}
function addP(el){[...el.files].forEach(f=>fin({files:[f]},d=>{D.photos.push({cap:'New memory',date:new Date().toISOString().slice(0,10),img:d});A()}))}
function add(k){const b={photos:{cap:'',date:'',img:''},reasons:{title:'',text:''},timeline:{date:'',title:'',text:'',img:''},playlist:{title:'',artist:'',url:''},dates:{date:'',title:''}}[k];D[k].push(b);A()}
function del(k,i){if(confirm('Delete this item?')){D[k].splice(i,1);A()}}
function A(){const T=['Overview','Homepage','Photos','Love Letter','Reasons','Timeline','Playlist','Special Dates','Settings'];
$('tabs').innerHTML=T.map(t=>`<button class="${t===tab?'on':''}" onclick="tab='${t}';A()">${t}</button>`).join('')+`<button onclick="save()">💾 Save all</button><button onclick="prev()">✎ Edit text on page</button><button onclick="logout()">Log out</button>`;
let h=`<h2 style="text-align:left">${tab}</h2>`;
if(tab=='Overview')h+=`<div class="card">Photos: ${D.photos.length} · Reasons: ${D.reasons.length} · Timeline: ${D.timeline.length} · Songs: ${D.playlist.length} · Dates: ${D.dates.length}<br><br><b>How saving works:</b> "Save all changes" publishes your edits so everyone with the link sees them (the page reloads after publishing). Only the page owner signed in to claude.ai can publish. The password just hides the editor.</div>`;
else if(tab=='Homepage')h+=`<div class="row card"><label>Hero photo (the circle)</label><img src="${D.home.hero||ph(1)}" alt="" style="width:120px;height:120px;border-radius:50%"><input type="file" accept="image/*" onchange="fin(this,d=>{D.home.hero=d;A()})"><button class="btn dg" onclick="D.home.hero='';A()">Remove photo</button></div>`+HF.map(([f,l])=>`<div class="row card"><label>${l}</label><textarea rows="2" oninput="D.home.${f}=this.value">${esc(D.home[f])}</textarea></div>`).join('')+`<h3>Other website text</h3>`+TX.map(([k,l,d])=>`<div class="row card"><label>${l}</label><input value="${esc(D.t&&D.t[k]!=null?D.t[k]:d)}" oninput="(D.t=D.t||{})['${k}']=this.value"></div>`).join('');
else if(tab=='Love Letter')h+=`<div class="card"><textarea rows="14" oninput="D.letter=this.value">${esc(D.letter)}</textarea></div>`;
else if(tab=='Settings')h+=`<div class="card"><label>New password</label><input id="np" type="password"><button class="btn" onclick="if(np.value.length>3){D.pw=np.value;save()}else toast('Too short')">Change password</button> <button class="btn dg" onclick="if(confirm('Reset all content?')){D=structuredClone(def);save();A()}">Reset content</button></div>`;
else{const[k,fs,im]=SC[tab];if(k=='photos')h+=`<div class="card row"><label>Upload multiple photos</label><input type="file" accept="image/*" multiple onchange="addP(this)"></div>`;
h+=D[k].map((x,i)=>`<div class="card row">${im?`<img src="${x.img||ph(i)}" alt=""><input type="file" accept="image/*" onchange="up(this,'${k}',${i})">`:''}${fs.map(f=>`<label>${f}</label>${f=='text'?`<textarea rows=3 oninput="S('${k}',${i},'${f}',this.value)">${esc(x[f])}</textarea>`:`<input ${f=='date'?'type=date':''} value="${esc(x[f])}" oninput="S('${k}',${i},'${f}',this.value)">`}`).join('')}<button class="btn dg" onclick="del('${k}',${i})">Delete</button></div>`).join('')+(k!='photos'?`<button class="btn" onclick="add('${k}')">+ Add</button>`:'')}
$('ac').innerHTML=h+`<p><button class="btn" onclick="save()">💾 Save all changes</button></p>`}
R();
if(SB())fetch(CFG.url+'/rest/v1/site?id=eq.1&select=data',{headers:{apikey:CFG.key}}).then(r=>r.json()).then(r=>{const d=r&&r[0]&&r[0].data;if(d&&d.home&&!adm.classList.contains('on')){D=d;R()}}).catch(()=>{});
</script></body></html>
